
services:
  nse_bhavcopy_scraper:
    # image: ghcr.io/bhargavagonugunta/nse_bhavcopy:sha-b53af59
    build: .
    image: nse_bhavcopy:local
    container_name: nse_bhavcopy_production
    restart: unless-stopped
    
    volumes:
      - ./downloads:/app/downloads
      - ./logs:/app/logs
    
    environment:
      # SMTP Configuration (Google SMTP)
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_SECURE=false
      - SMTP_USER=bhargavagonugunta123@gmail.com
      - SMTP_PASS=mget cbyi gvzp ifam
      - SMTP_FROM=bhargavagonugunta123@gmail.com
      - SMTP_TO=kpdasari@gmail.com
    
      # Node Environment
      - NODE_ENV=production
      - TZ=Asia/Kolkata
    
    working_dir: /app
    
    # Health check to ensure container is running properly
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Resource limits (adjust based on your server capacity)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
